name: Sprint0 Smoke (close N2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-smoke:
    name: GUT headless smoke (Sprint 0)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Clone GUT (pin to Godot 4.x compatible release) ─────
      - name: Clone GUT test framework
        run: |
          echo ">>> Cloning GUT (pinned to v9.3.0 for Godot 4.4) ..."
          rm -rf /tmp/gut_repo addons/gut
          mkdir -p addons
          git clone --depth 1 --branch v9.3.0 https://github.com/bitwes/Gut.git /tmp/gut_repo
          echo ">>> Flattening: GUT repo has inner addons/gut/ layout"
          cp -r /tmp/gut_repo/addons/gut addons/gut
          rm -rf /tmp/gut_repo
          echo ">>> Verifying GUT structure:"
          ls -la addons/gut/
          if [ ! -f addons/gut/gut_cmdln.gd ]; then
            echo "::error::gut_cmdln.gd not found at addons/gut/gut_cmdln.gd!"
            find addons/gut/ -name "gut_cmdln.gd" 2>/dev/null || true
            exit 1
          fi
          echo ">>> GUT v9.3.0 ready."

      # ── 2. Import project resources (required for headless) ──
      - name: Import Godot resources
        run: |
          godot --headless --import --quit 2>&1 || true
          # Note: --import may return non-zero on some setups;
          # we allow it to proceed as long as .import files are created.
          echo ">>> Import done. Checking .import files:"
          find . -name "*.import" | head -10 || echo "(no .import files yet)"

      # ── 3. Run GUT headless smoke + post status (single container step) ──
      # Everything lives in ONE step so we never rely on cross-step / cross-
      # container output passing (GitHub does not propagate a container step's
      # $GITHUB_OUTPUT to a host step). The container has python3 + egress +
      # GITHUB_TOKEN, so we POST the commit status straight from here.
      - name: Run Sprint 0 GUT smoke + post commit status
        id: gut
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gexit \
            -glog=3 \
            > gut_output.txt 2>&1
          GUT_EXIT=$?
          SUMMARY=$(grep -E "^(Scripts|Tests|Passing|Failing)" gut_output.txt 2>/dev/null \
            | tr '\n' ' ' | sed 's/  */ /g' | sed 's/ *$//')
          if [ -z "$SUMMARY" ]; then SUMMARY="GUT output not parsed (godot_exit=$GUT_EXIT)"; fi
          DESC="GUT: $SUMMARY"
          echo ">>> GUT summary: $DESC"

          # Post commit status directly from the container (python3 + egress + GITHUB_TOKEN).
          command -v python3 >/dev/null 2>&1 || { echo 'installing python3...'; apt-get update -qq && apt-get install -y python3; } || true
          export DESC
          python3 - <<'PY' || echo '::warning::status post failed'
          import os, json, urllib.request
          desc = os.environ.get('DESC', '')
          token = os.environ.get('GITHUB_TOKEN', '')
          sha = os.environ.get('GITHUB_SHA', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          state = 'success' if ('Failing: 0' in desc or 'Failing 0' in desc) else 'failure'
          body = json.dumps({'state': state, 'description': desc[:140], 'context': 'gut-smoke'}).encode()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=body, method='POST',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'ci'})
          try:
              urllib.request.urlopen(req, timeout=20).read()
              print('Posted commit status ->', state, '|', desc)
          except Exception as e:
              print('STATUS_POST_FAILED:', repr(e))
          PY

          # Enforce job red while GUT has failures.
          if echo "$SUMMARY" | grep -qE 'Failing[: ]+0([^0-9]|$)'; then
            echo "GUT reports zero failures — job passes."
            exit 0
          fi
          echo "::error::GUT reports failing tests — job fails."
          exit 1

name: Sprint0 Smoke (close N2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-smoke:
    name: GUT headless smoke (Sprint 0)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Clone GUT (pin to Godot 4.x compatible release) ─────
      - name: Clone GUT test framework
        run: |
          echo ">>> Cloning GUT (pinned to v9.3.0 for Godot 4.4) ..."
          rm -rf /tmp/gut_repo addons/gut
          mkdir -p addons
          git clone --depth 1 --branch v9.3.0 https://github.com/bitwes/Gut.git /tmp/gut_repo
          echo ">>> Flattening: GUT repo has inner addons/gut/ layout"
          cp -r /tmp/gut_repo/addons/gut addons/gut
          rm -rf /tmp/gut_repo
          echo ">>> Verifying GUT structure:"
          ls -la addons/gut/
          if [ ! -f addons/gut/gut_cmdln.gd ]; then
            echo "::error::gut_cmdln.gd not found at addons/gut/gut_cmdln.gd!"
            find addons/gut/ -name "gut_cmdln.gd" 2>/dev/null || true
            exit 1
          fi
          echo ">>> GUT v9.3.0 ready."

      # ── 2. Import project resources (required for headless) ──
      - name: Import Godot resources
        run: |
          godot --headless --import --quit 2>&1 || true
          # Note: --import may return non-zero on some setups;
          # we allow it to proceed as long as .import files are created.
          echo ">>> Import done. Checking .import files:"
          find . -name "*.import" | head -10 || echo "(no .import files yet)"

      # ── 3. Run GUT headless smoke + write summary to workspace ──
      # Container step outputs/env files do NOT propagate to host steps, but
      # workspace files (bind-mounted volume) ARE visible to host steps. So we
      # only run GUT + write the summary to $GITHUB_WORKSPACE here; the host
      # step below reads that file and POSTs the commit status.
      - name: Run Sprint 0 GUT smoke + write summary
        id: gut
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gexit \
            -glog=3 \
            > gut_output.txt 2>&1 || true
          SUMMARY=$(grep -Ei "^[[:space:]]*(scripts|tests|passing|failing)[[:space:]]*[:=]?[[:space:]]*[0-9]+" gut_output.txt 2>/dev/null \
            | sed -E 's/^[[:space:]]+//' \
            | awk '!seen[$0]++' \
            | tr '\n' ' ' | sed 's/  */ /g' | sed 's/ *$//')
          if [ -z "$SUMMARY" ]; then SUMMARY="GUT output not parsed"; fi
          DESC="GUT: $SUMMARY"
          echo ">>> GUT summary: $DESC"
          printf '%s' "$DESC" > "${GITHUB_WORKSPACE}/gut_summary.txt"
          # Per-file detail: extract each test script's pass/fail/error counts.
          # GUT -glog=3 outputs per-script sections with "Passing/Failing/Error" lines.
          perl -0777 -ne '
            while (/^(test_\S+\.gd)\n(.*?)(?=^test_\S+\.gd|\Z)/gsm) {
              my $f = $1; my $body = $2;
              my ($p,$e,$err) = (0,0,0);
              $p = $1 if $body =~ /passing\s*:\s*(\d+)/i;
              $e = $1 if $body =~ /failing\s*:\s*(\d+)/i;
              $err = $1 if $body =~ /error(s?)\s*:\s*(\d+)/i;
              printf "%s  P:%d F:%d E:%d\n", $f, $p, $e, $err;
            }
          ' gut_output.txt > "${GITHUB_WORKSPACE}/gut_detail.txt" 2>/dev/null || true
          # Build a condensed per-file string for commit status description.
          DETAIL=$(perl -0777 -ne '
            while (/^(test_(\S+))\.gd\n(.*?)(?=^test_\S+\.gd|\Z)/gsm) {
              my $abbr = substr($2, 0, 8);
              my $body = $3;
              my ($p,$e,$err) = (0,0,0);
              $p = $1 if $body =~ /passing\s*:\s*(\d+)/i;
              $e = $1 if $body =~ /failing\s*:\s*(\d+)/i;
              $err = $1 if $body =~ /error(s?)\s*:\s*(\d+)/i;
              printf "%s %d/%d/%d ", $abbr, $p, $e, $err;
            }
          ' gut_output.txt 2>/dev/null)
          echo ">>> Condensed detail: $DETAIL"
          printf '%s' "GUT: $SUMMARY | $DETAIL" > "${GITHUB_WORKSPACE}/gut_summary.txt"
          echo ">>> wrote ${GITHUB_WORKSPACE}/gut_summary.txt (with per-file detail)"
          if echo "$SUMMARY" | grep -qE 'Failing[: ]+0([^0-9]|$)'; then
            echo "GUT reports zero failures — job passes."
            exit 0
          fi
          echo "::error::GUT reports failing tests — job fails."
          exit 1

      # ── 4. Post GUT summary as a public commit status (host step) ──
      # Runs on the runner HOST (not the godot-ci container) with a reliable
      # GITHUB_TOKEN, reads the summary file written by step 3 (workspace is
      # shared between container + host), and POSTs it to the anonymous
      # statuses API so the orchestrator can read test counts via API.
      - name: Post GUT summary as commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const f = path.join(process.env.GITHUB_WORKSPACE, 'gut_summary.txt');
            let desc = 'GUT summary file missing (infra issue)';
            try { desc = fs.readFileSync(f, 'utf8').trim(); } catch (e) { console.log('read err', e.message); }
            const state = (desc.includes('Failing: 0') || desc.includes('Failing 0')) ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              description: desc.slice(0, 140),
              context: 'gut-smoke'
            });
            console.log('Posted commit status ->', state, '|', desc);
            // Log per-file detail for debugging.
            const df = path.join(process.env.GITHUB_WORKSPACE, 'gut_detail.txt');
            try {
              const detail = fs.readFileSync(df, 'utf8').trim();
              console.log('=== PER-FILE GUT DETAIL ===');
              console.log(detail);
              console.log('=== END DETAIL ===');
            } catch (e2) { console.log('detail file not found:', e2.message); }

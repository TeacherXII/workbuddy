name: Sprint0 Smoke (close N2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-smoke:
    name: GUT headless smoke (Sprint 0)
    runs-on: ubuntu-latest
    container:
      # Pin to a specific 4.4.x patch. The bare "4.4" tag is floating and silently
      # drifted between patch builds (the 2-arg commit() parse-error incident proved
      # patch drift can flip a tolerated call into a hard failure). 4.4.1 is the only
      # concrete patch tag published for the 4.4 line, so pin there for CI stability.
      image: barichello/godot-ci:4.4.1
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Clone GUT (pin to Godot 4.x compatible release) ─────
      - name: Clone GUT test framework
        run: |
          echo ">>> Cloning GUT (pinned to v9.3.0 for Godot 4.4) ..."
          rm -rf /tmp/gut_repo addons/gut
          mkdir -p addons
          git clone --depth 1 --branch v9.3.0 https://github.com/bitwes/Gut.git /tmp/gut_repo
          echo ">>> Flattening: GUT repo has inner addons/gut/ layout"
          cp -r /tmp/gut_repo/addons/gut addons/gut
          rm -rf /tmp/gut_repo
          echo ">>> Verifying GUT structure:"
          ls -la addons/gut/
          if [ ! -f addons/gut/gut_cmdln.gd ]; then
            echo "::error::gut_cmdln.gd not found at addons/gut/gut_cmdln.gd!"
            find addons/gut/ -name "gut_cmdln.gd" 2>/dev/null || true
            exit 1
          fi
          echo ">>> GUT v9.3.0 ready."

      # ── 2. Import project resources (required for headless) ──
      - name: Import Godot resources
        run: |
          godot --headless --import --quit 2>&1 || true
          # Note: --import may return non-zero on some setups;
          # we allow it to proceed as long as .import files are created.
          echo ">>> Import done. Checking .import files:"
          find . -name "*.import" | head -10 || echo "(no .import files yet)"

      # ── 3. Run GUT headless smoke + write summary to workspace ──
      # Container step outputs/env files do NOT propagate to host steps, but
      # workspace files (bind-mounted volume) ARE visible to host steps. So we
      # only run GUT + write the summary to $GITHUB_WORKSPACE here; the host
      # step below reads that file and POSTs the commit status.
      - name: Run Sprint 0 GUT smoke + write summary
        id: gut
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gexit \
            -glog=3 \
            > gut_output.txt 2>&1 || true
          # N-7: capture "Risky/Pending N" too. GUT's summary.gd only prints
          # that row via _log_non_zero_total(), i.e. it is ABSENT on a clean
          # run — so its mere presence signals risky/pending tests. Surfacing
          # it in SUMMARY makes gate G4 readable from the commit status API.
          SUMMARY=$(grep -Ei "^[[:space:]]*(scripts|tests|passing|failing|risky/pending)[[:space:]]*[:=]?[[:space:]]*[0-9]+" gut_output.txt 2>/dev/null \
            | sed -E 's/^[[:space:]]+//' \
            | awk '!seen[$0]++' \
            | tr '\n' ' ' | sed 's/  */ /g' | sed 's/ *$//')
          if [ -z "$SUMMARY" ]; then SUMMARY="GUT output not parsed"; fi
          DESC="GUT: $SUMMARY"
          echo ">>> GUT summary: $DESC"
          printf '%s' "$DESC" > "${GITHUB_WORKSPACE}/gut_summary.txt"
          # Surface WHICH tests failed via the commit-status description
          # (API-readable, since workflow logs need auth). GUT prints
          # "[Failed] test_name - <msg>" for assertion failures, but does NOT
          # include res:// paths on those lines (that format is only for
          # Godot's own SCRIPT/Parse errors). So extract the failed test
          # names; the orchestrator maps them to files locally.
          # Extract failing TEST NAMES from GUT's ACTUAL failure format.
          # GUT prints each test as "* test_name", then on failure a
          # "[Failed]: <msg>" line. We track the last "* <name>" line and emit
          # it whenever a "[Failed]" line follows. (Passing tests also print
          # "* name" but are never followed by [Failed], so they're excluded.)
          # Strip the "test_" prefix to fit the 140-char status limit.
          # NOTE: deliberately NO head -12 / cut -c1-120 truncation here — the
          # orchestrator reads the full FAIL_TESTS from this job's log (which is
          # not subject to the 140-char commit-status limit) to get every failing
          # test name. Truncation previously hid failures 6-10.
          FAIL_TESTS=$(awk '
            /^[*] / { tn=$0; sub(/^[*] /, "", tn); sub(/<.*/, "", tn); }
            /\[Failed\]/ { if (tn != "") print tn; }
          ' gut_output.txt 2>/dev/null \
            | sed 's/^test_//' | sort -u | tr '\n' ',' | sed 's/,$//')
          # Fallback: raw failing lines (truncated) if the awk above misses.
          FAIL_RAW=$(grep -Ei "\[Failed\]|assert" gut_output.txt 2>/dev/null \
            | grep -Evi "passed" | head -4 \
            | sed -E 's/^[[:space:]]+//' | cut -c1-110 | tr '\n' '|')
          FAIL_TXT=""
          if [ -n "$FAIL_TESTS" ]; then FAIL_TXT="fails:[$FAIL_TESTS]"; fi
          if [ -z "$FAIL_TXT" ] && [ -n "$FAIL_RAW" ]; then FAIL_TXT="raw:[$FAIL_RAW]"; fi
          if [ -z "$FAIL_TXT" ]; then FAIL_TXT="no failures captured"; fi
          echo ">>> Failing tests: $FAIL_TESTS"
          echo ">>> Failing paths: $FAIL_FILES"
          printf '%s' "GUT: $SUMMARY | $FAIL_TXT" > "${GITHUB_WORKSPACE}/gut_summary.txt"
          echo ">>> wrote ${GITHUB_WORKSPACE}/gut_summary.txt (with failing test names)"
          # Pass/fail gate: judge by the PRESENCE of failure signals, never by
          # the presence of a literal "Failing 0". GUT 9.3.0 omits the "Failing"
          # row entirely when nothing fails (run #30 printed only
          # "Scripts 7 / Passing 59"), so the old `grep 'Failing 0'` check went
          # unmatched and red-flagged a 59/59 green run.
          # Keep the gate fail-CLOSED on infra breakage: if GUT produced no
          # parsable counts at all, that is a failure, not a silent pass.
          if [ "$SUMMARY" = "GUT output not parsed" ]; then
            echo "::error::GUT produced no parsable summary (crash/import issue) — job fails."
            exit 1
          fi
          # N-7 (Batch C, principal-approved; QA plan gate G4): a [Risky] test
          # is a test that asserted NOTHING (or a skipped script). It used to
          # pass this gate silently, so an empty test could masquerade as
          # coverage. Mirror the [Failed] check: any [Risky] line, or a
          # non-zero "Risky/Pending" total, now fails the job as well.
          # GUT v9.3.0 emits genuine risky/pending as "[Risky]:  <msg>" /
          # "[Pending]:  <msg>" (logger._output_type appends ":  " after the
          # bracket — verified against GUT source), and a skipped script as
          # "[Risky] Script was skipped:". We match those EXACT forms, NOT a
          # bare "[Risky]", so a passing test whose DESCRIPTION merely mentions
          # the word (e.g. "must never contain the N-7 risky token") cannot
          # trip the gate (see Batch D CI false-red incident, H29 wording).
          if grep -qE '\[Risky\]:|\[Pending\]:|\[Risky\] Script was skipped' gut_output.txt 2>/dev/null \
             || echo "$SUMMARY" | grep -qE 'Risky/Pending[[:space:]]*[:=]?[[:space:]]*[1-9][0-9]*'; then
            RISKY_N=$(grep -cE '\[Risky\]:|\[Pending\]:|\[Risky\] Script was skipped' gut_output.txt 2>/dev/null || echo 0)
            echo "::error::GUT reports $RISKY_N risky/pending test(s) — job fails (N-7 gate)."
            echo ">>> Risky lines:"
            grep -nE '\[Risky\]:|\[Pending\]:|\[Risky\] Script was skipped' gut_output.txt 2>/dev/null | head -20 || true
            exit 1
          fi
          # ── N-7b: a test file that never LOADED is worse than a risky one ──
          # Discovered on PR #10 (Sprint 3 Batch B). A GDScript parse error makes
          # Godot drop the file BEFORE GUT can collect it, so the script simply
          # is not in the run. GUT then prints a perfectly clean summary of the
          # scripts that DID load ("Scripts 13 Tests 149 Passing 149") and every
          # gate above passes — including N-7, because a file that never loaded
          # can never emit "[Risky] Script was skipped". Result: a fully GREEN
          # build in which an entire 35-test suite ran zero times.
          #
          # This is the N-7 principle one level up: N-7 catches a TEST that
          # asserted nothing; this catches a FILE that executed nothing. Absence
          # of evidence was being reported as evidence of absence.
          #
          # Matched on Godot's own loader error, which is unambiguous and cannot
          # be produced by a passing test's description (unlike a bare "[Risky]"
          # — see the Batch D false-red incident above, whose lesson we keep by
          # matching the engine's exact wording rather than a loose keyword).
          #
          # ★ CASE SENSITIVITY FIX (S3-B follow-up F1). As first written the
          # second alternative was `SCRIPT ERROR:.*Parse error` — lowercase `e` —
          # and it was a DEAD BRANCH: zero hits across both the false-green and
          # the true-green run that were pulled down and diffed by hand. Godot
          # 4.4 prints the loader failure as
          #     SCRIPT ERROR: Parse Error: Cannot call non-static function ...
          # with a CAPITAL E, and `grep -E` is case sensitive, so that half never
          # fired. The whole gate was resting on `Failed to load script` alone —
          # it worked, but on one leg. The lowercase spelling is not imaginary
          # either: ResourceLoader embeds it in the OTHER message
          # (`... with error "Parse error".`), which is almost certainly where it
          # was copied from. Both spellings are real, so both are matched now.
          #
          # ★ WHY `[Pp]`/`[Ee]` AND NOT `grep -i`. A blanket -i would also loosen
          # `Failed to load script`, and would let an ordinary lowercase
          # "script error:" written in a test's own prose reach the gate. The
          # character classes widen exactly the two letters that were wrong and
          # nothing else.
          #
          # ★ WHY THE parse QUALIFIER MUST NEVER BE DROPPED. A legitimately green
          # run DOES contain SCRIPT ERROR lines: tests that exercise negative
          # paths on purpose (the last green run had three, e.g. `SCRIPT ERROR:
          # Invalid operands 'String' and 'int' in operator '=='`). Matching a
          # bare `SCRIPT ERROR` would turn main red on the next push. This gate
          # is for load/parse failures ONLY.
          #
          # Scope is deliberately gut_output.txt ONLY — the `--import` step above
          # is allowed to be noisy and is not evidence about the test run.
          #
          # Reverse-asserted in tests/unit/test_ci_gates.gd, which re-reads THIS
          # file, compiles the pattern below with RegEx and pins both what it
          # MUST catch and what it MUST NOT.
          if grep -qE 'Failed to load script|SCRIPT ERROR:.*[Pp]arse [Ee]rror' gut_output.txt 2>/dev/null; then
            echo "::error::A test script failed to LOAD — it was silently excluded from the run (N-7b gate)."
            echo ">>> Unloadable scripts:"
            grep -nE 'Failed to load script|SCRIPT ERROR:.*[Pp]arse [Ee]rror' gut_output.txt 2>/dev/null | head -20 || true
            exit 1
          fi
          if ! grep -qF '[Failed]' gut_output.txt 2>/dev/null \
             && ! echo "$SUMMARY" | grep -qE 'Failing[[:space:]]*[:=]?[[:space:]]*[1-9][0-9]*'; then
            echo "GUT reports zero failures and zero risky tests — job passes."
            exit 0
          fi
          echo "::error::GUT reports failing tests — job fails."
          exit 1

      # ── 4b. Assert-credibility lint (Sprint 3 Task #48; reinforces N-7 / N-7b) ──
      # Catches assertions that print [Passed] but verified nothing — the exact
      # failure mode behind the "184/184 green" incident where three defects
      # shipped in a fully-green suite:
      #   A-class  a message / garbage string was passed into a NON-text GUT
      #            parameter (e.g. assert_signal_emitted_with_parameters' 4th arg
      #            is `index:int`). GUT throws internally, the comparison is
      #            skipped, and [Passed] is STILL printed — with "got <null>".
      #   B-class  an expression crashed BEFORE the assert was evaluated (e.g. an
      #            out-of-bounds split()[1]). The assert evaporates; GUT reports
      #            one fewer assert and the test still passes.
      # Neither is [Risky] and neither is a load failure, so the gates above
      # (N-7 / N-7b) cannot see them. The linter has a built-in --selftest that
      # runs FIRST, so a broken linter fails the job loudly instead of silently.
      # Verified clean on main (local, python 3.13): selftest 7/7 planted caught,
      # 0 false positives; A-class scan of tests/unit = 0 findings.
      # Gated on GUT success: if GUT already failed the build, lint is redundant;
      # if GUT is green but lint finds a silent no-op assertion, the build fails
      # here — which is the entire point of this gate.
      - name: Assert credibility lint (assert_lint.py)
        if: steps.gut.outcome == 'success'
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          if ! command -v "$PY" >/dev/null 2>&1; then
            echo "::error::assert_lint.py requires python3, none found in container — job fails."
            exit 1
          fi
          echo ">>> assert_lint selftest (fail-closed on a broken linter)"
          "$PY" tests/ci/assert_lint.py --selftest || exit 1
          # A-class (GUT signature misuse) is the proven, zero-false-positive
          # check — it is the gate. It catches assertions whose message/garbage
          # string landed in a NON-text param (e.g. assert_signal_emitted_*
          # 4th arg = index:int), where GUT throws internally, skips the
          # comparison, yet still prints [Passed]. Verified clean on main
          # (local python 3.13): 0 findings across tests/unit.
          echo ">>> assert_lint A-class (FAIL-CLOSED gate)"
          "$PY" tests/ci/assert_lint.py --tests-dir tests/unit || exit 1
          # B-class (asserts that never executed) is REPORT-ONLY for now.
          # Its current heuristic (static count vs runtime count) false-positives
          # on DELIBERATELY branch-divergent tests that early-return (e.g.
          # test_save_ui.gd:841 skips 1 of 6 asserts by design when the hue
          # collapse is absent). Promoting it to fail-closed would red main for
          # sound tests. Keep it visible via warning until the heuristic learns
          # to tolerate if/return divergence (owner: engineering-lead).
          echo ">>> assert_lint B-class (report-only)"
          "$PY" tests/ci/assert_lint.py --tests-dir tests/unit --gut-log gut_output.txt || \
            echo "::warning::assert_lint B-class flagged potential non-executing assertions (report-only; not gating). See engineering-lead follow-up."
          echo ">>> assert_lint A-class clean — no silent no-op assertions."

      # ── 4. Post GUT summary as a public commit status (host step) ──
      # Runs on the runner HOST (not the godot-ci container) with a reliable
      # GITHUB_TOKEN, reads the summary file written by step 3 (workspace is
      # shared between container + host), and POSTs it to the anonymous
      # statuses API so the orchestrator can read test counts via API.
      - name: Post GUT summary as commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const f = path.join(process.env.GITHUB_WORKSPACE, 'gut_summary.txt');
            let desc = 'GUT summary file missing (infra issue)';
            try { desc = fs.readFileSync(f, 'utf8').trim(); } catch (e) { console.log('read err', e.message); }
            // Mirror step 3's gate: decide on failure SIGNALS, not on a literal
            // "Failing 0" — GUT 9.3.0 prints no "Failing" row when nothing fails,
            // so the old check marked fully-green runs as failure.
            // The last two clauses keep infra breakage fail-closed (unchanged
            // behaviour: a missing/unparsable summary must not report success).
            // N-7: keep this status consistent with step 3's gate — a run that
            // step 3 failed for risky/pending tests must NOT be posted green.
            const isFail = desc.includes('[Failed]')
              || /Failing[\s:=]*[1-9]\d*/i.test(desc)
              || desc.includes('[Risky]:')
              || /Risky\/Pending[\s:=]*[1-9]\d*/i.test(desc)
              || desc.includes('fails:[')
              || desc.includes('summary file missing')
              || desc.includes('GUT output not parsed');
            const state = isFail ? 'failure' : 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              description: desc.slice(0, 140),
              context: 'gut-smoke'
            });
            console.log('Posted commit status ->', state, '|', desc);

      # ── 5. Upload raw GUT output for failure triage ──
      # Host step (workspace shared with container). The orchestrator downloads
      # this zip to read the exact "[Failed]: <msg>" lines and classify each
      # failure as a real logic bug vs. a headless-env limitation.
      - name: Upload raw GUT output (failure triage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-output
          path: gut_output.txt
          if-no-files-found: warn

name: Sprint0 Smoke (close N2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gut-smoke:
    name: GUT headless smoke (Sprint 0)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Clone GUT (pin to Godot 4.x compatible release) ─────
      - name: Clone GUT test framework
        run: |
          echo ">>> Cloning GUT (pinned to v9.3.0 for Godot 4.4) ..."
          rm -rf /tmp/gut_repo addons/gut
          mkdir -p addons
          git clone --depth 1 --branch v9.3.0 https://github.com/bitwes/Gut.git /tmp/gut_repo
          echo ">>> Flattening: GUT repo has inner addons/gut/ layout"
          cp -r /tmp/gut_repo/addons/gut addons/gut
          rm -rf /tmp/gut_repo
          echo ">>> Verifying GUT structure:"
          ls -la addons/gut/
          if [ ! -f addons/gut/gut_cmdln.gd ]; then
            echo "::error::gut_cmdln.gd not found at addons/gut/gut_cmdln.gd!"
            find addons/gut/ -name "gut_cmdln.gd" 2>/dev/null || true
            exit 1
          fi
          echo ">>> GUT v9.3.0 ready."

      # ── 2. Import project resources (required for headless) ──
      - name: Import Godot resources
        run: |
          godot --headless --import --quit 2>&1 || true
          # Note: --import may return non-zero on some setups;
          # we allow it to proceed as long as .import files are created.
          echo ">>> Import done. Checking .import files:"
          find . -name "*.import" | head -10 || echo "(no .import files yet)"

      # ── 3. Run GUT headless smoke + capture summary ─────────
      - name: Run Sprint 0 GUT smoke (exit std ⑤)
        id: gut
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit \
            -gexit \
            -glog=3 \
            > gut_output.txt 2>&1
          GUT_EXIT=$?
          SUMMARY=$(grep -E "^(Scripts|Tests|Passing|Failing)" gut_output.txt 2>/dev/null \
            | tr '\n' ' ' | sed 's/  */ /g' | sed 's/ *$//')
          if [ -z "$SUMMARY" ]; then SUMMARY="GUT output not parsed (godot_exit=$GUT_EXIT)"; fi
          echo "summary=GUT: $SUMMARY" >> "$GITHUB_OUTPUT"
          echo ">>> GUT summary: $SUMMARY"

      # ── 4. Post GUT summary as a public commit status ───────
      # Robust approach: use actions/github-script, which runs on the
      # runner HOST (not inside the godot-ci container) with built-in
      # GITHUB_TOKEN auth — no curl/gh dependency inside the image.
      # It reads the GUT summary from step 3's outputs (GitHub-native
      # cross-container mechanism, NOT a workspace file) and posts it
      # to the anonymous statuses API so the orchestrator can read test
      # counts without tokens/screenshots. Job stays red while GUT has
      # failures; this step always runs.
      - name: Post GUT summary as commit status
        if: always()
        uses: actions/github-script@v7
        with:
          summary: ${{ steps.gut.outputs.summary }}
          script: |
            const summary = core.getInput('summary');
            let state = 'failure';
            if (summary.match(/Failing[: ]+0([^0-9]|$)/)) { state = 'success'; }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              description: summary.slice(0, 140),
              context: 'gut-smoke'
            });
            console.log('Posted commit status -> state=' + state + ' desc="' + summary + '"');

      - name: Enforce job status (red while GUT failing)
        if: always()
        run: |
          SUMMARY="${{ steps.gut.outputs.summary }}"
          echo "Resolved GUT summary: $SUMMARY"
          if [ -z "$SUMMARY" ]; then
            echo "::error::GUT summary output missing — infra issue."
            exit 1
          fi
          if echo "$SUMMARY" | grep -qE 'Failing[: ]+0([^0-9]|$)'; then
            echo "GUT reports zero failures — job passes."
            exit 0
          fi
          echo "::error::GUT reports failing tests — job fails."
          exit 1
